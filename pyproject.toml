[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmo"
version = "0.1.0"
description = "Roast-My-Outfit — outfit perception, style-compatibility scoring and roast generation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10.2",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "google-genai>=2.22.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
vlm = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.56",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
