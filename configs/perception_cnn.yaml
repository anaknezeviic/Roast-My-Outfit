preprocessing:
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  horizontal_flip: 0.5

inference:
  batch_size: 16

training:
  backbone: resnet50
  epochs: 30
  batch_size: 256
  extract_batch_size: 32
  learning_rate: 0.01
  weight_decay: 0.0001
  num_workers: 4
  seed: 20260101

checkpoint:
  path: models/perception_cnn/cnn_multihead_v1.pt
